model_list:
  # 国内站 platform.minimaxi.com / api.minimaxi.com（非国际 api.minimax.io）
  - model_name: MiniMax-M3
    litellm_params:
      model: minimax/MiniMax-M3
      api_key: os.environ/MINIMAX_API_KEY
      api_base: os.environ/MINIMAX_API_BASE
    # 业务从 /model/info 同步 supports_reasoning；价目表缺位时显式标注
    model_info:
      supports_reasoning: true
  - model_name: MiniMax-Text-01
    litellm_params:
      model: minimax/MiniMax-Text-01
      api_key: os.environ/MINIMAX_API_KEY
      api_base: os.environ/MINIMAX_API_BASE
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  # 科大讯飞 MaaS（OpenAI 兼容；Chat 基址需带 /v2）
  - model_name: spark-x2.6
    litellm_params:
      model: openai/spark-x2.6
      api_key: os.environ/XFYUN_API_KEY
      api_base: os.environ/XFYUN_API_BASE
    model_info:
      supports_reasoning: true
      # 供 /model/info → 业务库同步；缺省会被标 incomplete
      max_input_tokens: 1000000

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
