[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroagent"
version = "0.1.0"
description = "Enterprise internal AI agent platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiomysql>=0.2.0",
  "pymysql>=1.1.0",
  "alembic>=1.14.0",
  "celery[redis]>=5.4.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.17",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.0,<4.1",
  "aiosqlite>=0.20.0",
  "itsdangerous>=2.2.0",
  "redis>=5.2.0",
  "pymilvus>=2.4.0",
  "oss2>=2.18.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "llama-index-core>=0.12.0",
  "langgraph>=1.2.9",
  "langchain-core>=1.5.1",
  "langchain-openai>=1.4.1",
  "zhdate>=0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
